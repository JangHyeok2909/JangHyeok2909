name: Recent blog posts

on:
  schedule:
    # 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://janghyeok.tistory.com/rss"
          # 티스토리 RSS는 기본값 application/rss+xml 요청에 406을 돌려주므로 text/xml 지정
          accept_header: "text/xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          # 시작 표식 바로 뒤에 목록이 붙으면 그 줄 전체가 HTML 주석 블록으로 처리되어 첫 글이 링크로 렌더링되지 않으므로 줄바꿈 삽입
          tag_post_pre_newline: true
          date_format: "yyyy.mm.dd"
          commit_message: "docs: 블로그 최근 글 목록 갱신"
