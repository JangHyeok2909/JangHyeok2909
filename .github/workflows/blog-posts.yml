name: Recent blog posts

on:
  schedule:
    # 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://janghyeok.tistory.com/rss"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy.mm.dd"
          commit_message: "docs: 블로그 최근 글 목록 갱신"
